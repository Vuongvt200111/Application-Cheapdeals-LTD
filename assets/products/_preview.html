<!doctype html>
<meta charset="utf-8">
<title>CheapDeals — Product Artwork Preview</title>
<style>
  body { margin:0; padding:28px; background:#0b0f12; color:#e6f1f0; font-family:"Segoe UI",Arial,sans-serif; }
  h1 { font-size:20px; font-weight:600; margin:0 0 4px; }
  p.sub { color:#8fa3a1; font-size:14px; margin:0 0 26px; }
  h2 { font-size:15px; font-weight:600; color:#7fe0d3; margin:34px 0 12px; border-bottom:1px solid #1d2a2c; padding-bottom:6px; }
  .row { display:flex; gap:18px; align-items:flex-start; margin-bottom:22px; flex-wrap:wrap; }
  .full { flex:1 1 520px; max-width:620px; }
  .full img { width:100%; display:block; border-radius:12px; }
  .cardwrap { width:250px; }
  .card { background:#0e1519; border:1px solid rgba(0,229,255,0.14); border-radius:12px; padding:12px; }
  .visual { height:120px; border-radius:8px; margin-bottom:10px; overflow:hidden; position:relative;
            background:linear-gradient(135deg, rgba(0,229,255,0.06), rgba(255,43,214,0.06));
            border:1px solid rgba(0,229,255,0.12); }
  .photo { position:absolute; inset:0; background-size:230%; background-position:80% 45%; background-repeat:no-repeat; }
  .nm { font-size:14px; font-weight:600; margin:0 0 4px; }
  .pr { font-size:15px; font-weight:700; color:#00e5ff; }
  .lbl { font-size:12px; color:#7e908f; margin-bottom:6px; letter-spacing:1px; text-transform:uppercase; }
</style>
<h1>CheapDeals Product Artwork Preview</h1>
<p class="sub">Bên trái: ảnh đầy đủ (dùng ở trang chi tiết + checkout). Bên phải: đúng vùng cắt hiển thị trên home page cards.</p>
<div id="out"></div>
<script>
  const items = [
    ['prod-cable','CheapDeals DisplayPort to HDMI Cable','£12.00'],
    ['prod-mouse','CheapDeals Wireless Mouse','£15.00'],
    ['prod-keyboard','CheapDeals Mechanical Keyboard','£45.00'],
    ['prod-desktop','CheapDeals Desktop Office PC','£399.00'],
    ['prod-reno11','Oppo Reno 11 5G','£399.00'],
    ['prod-laptop','CheapDeals Laptop Pro 15','£599.00'],
    ['prod-s24','Samsung Galaxy S24','£899.00'],
    ['prod-iphone15','iPhone 15 Pro','£999.00'],
    ['bb-lite','Broadband Lite (Subscription package)','£18.00'],
    ['mob-pro','Mobile Premium (Subscription package)','£30.00']
  ];
  document.getElementById('out').innerHTML = items.map(([c,n,p]) => `
    <h2>${n} — ${c}.svg</h2>
    <div class="row">
      <div class="full"><div class="lbl">Ảnh đầy đủ</div><img src="${c}.svg" alt="${n}"></div>
      <div class="cardwrap"><div class="lbl">Trên card</div>
        <div class="card">
          <div class="visual"><div class="photo" style="background-image:url('${c}.svg')"></div></div>
          <div class="nm">${n}</div><div class="pr">${p}</div>
        </div>
      </div>
    </div>`).join('');
</script>
